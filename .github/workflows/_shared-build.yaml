
name: Reusable build workflow
on:
  workflow_call:
    inputs:
      # The exact commit to build: callers on pull_request pass the PR head sha, else checkout
      # builds refs/pull/<N>/merge. Safe: callers use pull_request, not pull_request_target.
      ref:
        description: 'Exact git ref/SHA to build (PR head sha)'
        default: ''
        required: false
        type: string
      release:
        description: 'Version stamped into the binaries (default: git describe)'
        default: ''
        required: false
        type: string
      docker:
        description: 'Build docker images'
        default: false
        required: false
        type: boolean
      docker_repository:
        description: 'Image repository (ghcr.io/ethpandaops/<image>)'
        default: ''
        required: false
        type: string
      docker_tag_prefix:
        description: 'Docker Image Tag Prefix'
        default: ''
        required: false
        type: string
      additional_tags:
        description: 'Additional Docker Image Tags (JSON)'
        default: ''
        required: false
        type: string
    secrets:
      IMAGE_MIRROR_URL:
        description: 'Image mirror URL (IMAGE_MIRROR_URL organization secret)'
        required: false

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

# shared build jobs
jobs:
  build_web_ui:
    name: Build web UI
    runs-on: ubuntu-latest
    outputs:
      artifact_id: ${{ steps.upload_web.outputs.artifact-id }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ inputs.ref }}

    - name: Set up node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24.x
        cache: npm
        cache-dependency-path: web/package-lock.json

    - name: Build web UI
      run: make build-web

    - name: "Upload artifact: web-ui"
      id: upload_web
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        path: ./web/dist/*
        name: web-ui

  build_linux_amd64_binary:
    name: Build linux/amd64 binaries
    needs: [build_web_ui]
    runs-on: ubuntu-latest
    outputs:
      artifact_id: ${{ steps.upload_binary.outputs.artifact-id }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ inputs.ref }}

    - name: Set up go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod

    - name: Download web UI build artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        artifact-ids: ${{ needs.build_web_ui.outputs.artifact_id }}
        merge-multiple: true
        path: ./web/dist

    # the touch keeps make from rebuilding the downloaded UI
    - name: Build linux amd64 binaries
      run: |
        touch web/dist/index.html
        make build ${RELEASE:+VERSION=$RELEASE}
      env:
        RELEASE: ${{ inputs.release }}

    - name: "Upload artifact: upgradoor_linux_amd64"
      id: upload_binary
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        path: ./bin/*
        name: upgradoor_linux_amd64

  build_linux_arm64_binary:
    name: Build linux/arm64 binaries
    needs: [build_web_ui]
    runs-on: ubuntu-24.04-arm
    outputs:
      artifact_id: ${{ steps.upload_binary.outputs.artifact-id }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ inputs.ref }}

    - name: Set up go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod

    - name: Download web UI build artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        artifact-ids: ${{ needs.build_web_ui.outputs.artifact_id }}
        merge-multiple: true
        path: ./web/dist

    - name: Build linux arm64 binaries
      run: |
        touch web/dist/index.html
        make build ${RELEASE:+VERSION=$RELEASE}
      env:
        RELEASE: ${{ inputs.release }}

    - name: "Upload artifact: upgradoor_linux_arm64"
      id: upload_binary
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        path: ./bin/*
        name: upgradoor_linux_arm64

  # The image holds the controller binary built above (Dockerfile target release).
  build_amd64_docker_image:
    name: Build amd64 docker image
    needs: [build_linux_amd64_binary]
    if: ${{ inputs.docker }}
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ inputs.ref }}

    - name: Get build version
      id: vars
      run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

    # prepare docker
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
    - name: Login to GitHub Container Registry
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}

    - name: Download build artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        artifact-ids: ${{ needs.build_linux_amd64_binary.outputs.artifact_id }}
        merge-multiple: true
        path: ./bin

    - name: Prepare build environment
      run: |
        mkdir -p dist
        install -m 0755 bin/upgradoor-controller dist/upgradoor-controller-linux-amd64
        ls -lach ./dist

    # Pushed by digest only: the multiarch job tags the index.
    - name: Build and push amd64 docker image
      id: push
      run: |
        docker buildx build . --file Dockerfile --target release --platform=linux/amd64 \
          --output type=image,name=${{ inputs.docker_repository }},push-by-digest=true,name-canonical=true,push=true \
          --metadata-file "$RUNNER_TEMP/build.json"
        digest=$(jq -er '."containerimage.digest"' "$RUNNER_TEMP/build.json")
        echo "digest=$digest" >> "$GITHUB_OUTPUT"
    - name: Attest amd64 docker image
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-name: ${{ inputs.docker_repository }}
        subject-digest: ${{ steps.push.outputs.digest }}
        push-to-registry: true

  build_arm64_docker_image:
    name: Build arm64 docker image
    needs: [build_linux_arm64_binary]
    if: ${{ inputs.docker }}
    runs-on: ubuntu-24.04-arm
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ inputs.ref }}

    - name: Get build version
      id: vars
      run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

    # prepare docker
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
    - name: Login to GitHub Container Registry
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}

    - name: Download build artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        artifact-ids: ${{ needs.build_linux_arm64_binary.outputs.artifact_id }}
        merge-multiple: true
        path: ./bin

    - name: Prepare build environment
      run: |
        mkdir -p dist
        install -m 0755 bin/upgradoor-controller dist/upgradoor-controller-linux-arm64
        ls -lach ./dist

    # Pushed by digest only: the multiarch job tags the index.
    - name: Build and push arm64 docker image
      id: push
      run: |
        docker buildx build . --file Dockerfile --target release --platform=linux/arm64 \
          --output type=image,name=${{ inputs.docker_repository }},push-by-digest=true,name-canonical=true,push=true \
          --metadata-file "$RUNNER_TEMP/build.json"
        digest=$(jq -er '."containerimage.digest"' "$RUNNER_TEMP/build.json")
        echo "digest=$digest" >> "$GITHUB_OUTPUT"
    - name: Attest arm64 docker image
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-name: ${{ inputs.docker_repository }}
        subject-digest: ${{ steps.push.outputs.digest }}
        push-to-registry: true

  build_multiarch_image:
    name: Build multiarch docker image
    needs: [build_amd64_docker_image, build_arm64_docker_image]
    if: ${{ inputs.docker }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ inputs.ref }}
    - name: Get build version
      id: vars
      run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

    # prepare docker
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
    - name: Login to GitHub Container Registry
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}

    - name: Build multiarch docker manifest
      id: manifest
      run: |
        docker buildx imagetools create --metadata-file "$RUNNER_TEMP/manifest.json" -t ${{ inputs.docker_repository }}:${{ inputs.docker_tag_prefix }}-${{ steps.vars.outputs.sha_short }} \
        ${{ inputs.docker_repository }}@${{ needs.build_amd64_docker_image.outputs.digest }} \
        ${{ inputs.docker_repository }}@${{ needs.build_arm64_docker_image.outputs.digest }}
        digest=$(jq -er '."containerimage.descriptor".digest' "$RUNNER_TEMP/manifest.json")
        echo "digest=$digest" >> "$GITHUB_OUTPUT"
    - name: Attest multiarch docker manifest (mirror to Docker Hub when IMAGE_MIRROR is true)
      uses: ethpandaops/actions/mirror-image@738aeadbcdc54f1c9af659d35f8ef29dd5c0fae6
      with:
        tags: ${{ inputs.docker_repository }}:${{ inputs.docker_tag_prefix }}-${{ steps.vars.outputs.sha_short }}
        digest: ${{ steps.manifest.outputs.digest }}
        attest-platforms: "false"
        mirror-url: ${{ secrets.IMAGE_MIRROR_URL }}
        mirror: ${{ vars.IMAGE_MIRROR == 'true' && 'true' || 'false' }}

  build_extra_image:
    name: Build additional docker manifests
    needs: [build_multiarch_image]
    if: ${{ inputs.additional_tags }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      matrix:
        tag: ${{ fromJSON(inputs.additional_tags) }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ inputs.ref }}
    - name: Get build version
      id: vars
      run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

    # prepare docker
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
    - name: Login to GitHub Container Registry
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}

    - name: "Build additional docker manifest: ${{ matrix.tag }}"
      id: manifest
      run: |
        docker buildx imagetools create --metadata-file "$RUNNER_TEMP/multiarch.json" -t ${{ inputs.docker_repository }}:${{ matrix.tag }} \
        ${{ inputs.docker_repository }}:${{ inputs.docker_tag_prefix }}-${{ steps.vars.outputs.sha_short }}
        digest=$(jq -er '."containerimage.descriptor".digest' "$RUNNER_TEMP/multiarch.json")
        echo "digest=$digest" >> "$GITHUB_OUTPUT"
    - name: "Attest additional docker manifest (mirror to Docker Hub when IMAGE_MIRROR is true): ${{ matrix.tag }}"
      uses: ethpandaops/actions/mirror-image@738aeadbcdc54f1c9af659d35f8ef29dd5c0fae6
      with:
        tags: ${{ inputs.docker_repository }}:${{ matrix.tag }}@${{ steps.manifest.outputs.digest }}
        attest-platforms: "false"
        mirror-url: ${{ secrets.IMAGE_MIRROR_URL }}
        mirror: ${{ vars.IMAGE_MIRROR == 'true' && 'true' || 'false' }}
