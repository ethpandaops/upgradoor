
name: Check E2E

# The Kurtosis run takes about half an hour: nightly, by hand, and on pull requests labelled "e2e".
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
  pull_request:
    branches: [ "master" ]
    types: [opened, synchronize, reopened, labeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  test_docker_classic:
    # The classic image store diffs layers without native overlay diff on the runners: ~6 min.
    name: "Test container recreate (real Docker, classic store)"
    if: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'e2e') }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod

    - name: Select the Docker image store
      env:
        CONTAINERD_STORE: false
      run: |
        sudo mkdir -p /etc/docker
        [ -s /etc/docker/daemon.json ] || echo '{}' | sudo tee /etc/docker/daemon.json >/dev/null
        sudo jq --argjson on "$CONTAINERD_STORE" '.features["containerd-snapshotter"] = $on' \
          /etc/docker/daemon.json > daemon.json
        sudo mv daemon.json /etc/docker/daemon.json
        sudo systemctl restart docker
        docker info --format '{{ .ServerVersion }} {{ .Driver }} {{ json .DriverStatus }}'

    - name: Run docker tests
      run: make test-docker

  test_e2e:
    name: "End to end (Kurtosis)"
    if: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'e2e') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
    - name: Set up node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24.x
        cache: npm
        cache-dependency-path: web/package-lock.json

    - name: Install Kurtosis
      run: |
        echo "deb [trusted=yes] https://apt.fury.io/kurtosis-tech/ /" | sudo tee /etc/apt/sources.list.d/kurtosis.list
        sudo apt-get update
        sudo apt-get install -y kurtosis-cli
        kurtosis analytics disable
        kurtosis engine start

    - name: Run e2e tests
      run: make e2e
