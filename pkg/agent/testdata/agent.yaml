keyFile: /etc/upgradoor/test.key
certFile: /etc/upgradoor/test.crt
stateDir: /var/lib/upgradoor-test
entryUser: ops
overridesFile: /home/ops/custom-overrides.yaml
socket:
  path: /run/upgradoor/test.sock
  group: ops
auditLog:
  file: /var/log/upgradoor/audit.log
  maxSizeBytes: 2097152
  maxFiles: 3
verbs: [roll, packages, reboot]
groups:
  execution:
    client: geth
    owners: [geth, panda]
    overrides: [image, flags]
    impact: node
    stopTimeout: 600s
  tooling:
    impact: independent
containers:
  execution: {group: execution, kind: el}
  exporter: {group: tooling}
defaultGroup:
  roll: true
  exclude: [tmp-*, debug]
packages:
  blocked: [docker-ce, containerd.io]
docker:
  host: unix:///run/docker-test.sock
probes:
  el: http://127.0.0.1:8545
  cl: http://127.0.0.1:5052
validators:
  markerFile: /data/.validator_keyrange
  start: 0
  end: 0
registry:
  pollInterval: 15m
  authFile: /root/.docker/test.json
  plainHttp: [registry.local:5000]
  caFile: /etc/ssl/registry-ca.pem
verify:
  window: 30s
  timeout: 5m
