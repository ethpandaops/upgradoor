version: 2

project_name: upgradoor

before:
  hooks:
    - go mod tidy
    - make build-web

builds:
  - id: upgradoor
    main: ./cmd/upgradoor
    binary: upgradoor
    env:
      - CGO_ENABLED=0
    tags:
      - webui
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Tag }}
    goos:
      - linux
    goarch:
      - amd64
      - arm64

# The Ansible role downloads upgradoor_<version>_linux_<arch>.tar.gz and
# verifies it against upgradoor_<version>_checksums.txt.
archives:
  - id: upgradoor
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE*

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"

changelog:
  sort: asc
